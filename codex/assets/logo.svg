<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 1254 1254" fill="none">
  <title>osmatrix Unified Layers</title>
  <desc>Three interlocking isometric platforms: silver macOS above blue Windows and orange Ubuntu, on a rounded navy tile. The area outside the tile is transparent.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1254" y2="1254" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b173c"/><stop offset="1" stop-color="#070f29"/>
    </linearGradient>
    <linearGradient id="silver-top" x1="400" y1="200" x2="840" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#e4e7ec"/>
    </linearGradient>
    <linearGradient id="silver-front" x1="280" y1="430" x2="940" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aeb4bf"/><stop offset=".48" stop-color="#cbd0d9"/><stop offset="1" stop-color="#e0e3e9"/>
    </linearGradient>
    <linearGradient id="blue-top" x1="180" y1="500" x2="650" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13bded"/><stop offset="1" stop-color="#0095f4"/>
    </linearGradient>
    <linearGradient id="blue-front" x1="190" y1="600" x2="600" y2="1050" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0078d4"/><stop offset=".55" stop-color="#0068ef"/><stop offset="1" stop-color="#005bd8"/>
    </linearGradient>
    <linearGradient id="blue-side" x1="460" y1="650" x2="710" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0041b8"/><stop offset="1" stop-color="#0050d7"/>
    </linearGradient>
    <linearGradient id="orange-top" x1="740" y1="730" x2="1070" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8b31"/><stop offset="1" stop-color="#ff711a"/>
    </linearGradient>
    <linearGradient id="orange-front" x1="750" y1="720" x2="1070" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e95420"/><stop offset=".48" stop-color="#ee4c0b"/><stop offset="1" stop-color="#cd3808"/>
    </linearGradient>
  </defs>
  <!-- The tile is part of the logo; its rounded exterior remains transparent. -->
  <rect width="1254" height="1254" rx="160" fill="url(#tile)"/>
  <!-- Silver platform: extruded front edge, then its chevron-shaped top. -->
  <path fill="url(#silver-front)" d="M260 378Q260 394 281 406L368 451Q390 463 410 451L531 383Q557 367 582 382L791 484Q821 503 846 477L974 402Q995 390 995 378V484Q995 503 976 514L846 589Q824 601 802 588L581 463Q551 445 518 464L410 526Q389 538 366 526L282 482Q260 470 260 450Z"/>
  <path fill="url(#silver-top)" d="M281 352L591 183Q626 163 662 184L975 353Q1015 379 974 402L846 477Q821 503 791 484L582 382Q557 367 531 383L410 451Q390 463 368 451L281 406Q241 380 281 352Z"/>
  <!-- Blue platform: a bent lower-left block with two visible depth faces. -->
  <path fill="url(#blue-front)" d="M179 534V789Q179 812 200 825L584 1068Q602 1081 625 1070L673 1041Q694 1029 694 1007V868L546 778Q507 753 545 727L606 687Q626 676 626 658V589Z"/>
  <path fill="url(#blue-side)" d="M454 705L604 618Q626 605 626 589V658Q626 677 606 689L545 727Q509 750 545 775L678 852Q694 861 694 871V1007Q694 1030 674 1041L626 1070V910L477 825Q454 811 454 788Z"/>
  <path fill="url(#blue-top)" d="M195 511L227 491Q239 483 252 491L365 554Q390 570 414 557L501 516Q516 507 533 516L607 559Q647 587 607 614L455 705L205 565Q163 542 195 511Z"/>
  <path fill="url(#blue-top)" d="M455 705V788Q454 811 477 825L626 910L684 875Q705 862 681 848L545 775Q509 750 545 727L605 689V618Z"/>
  <path fill="url(#blue-side)" d="M455 705L606 617Q626 605 626 589V658Q626 677 606 689L545 727Q509 750 545 775L477 736Q455 723 455 705Z"/>
  <!-- Orange platform: broad side face and a narrow illuminated upper face. -->
  <path fill="url(#orange-front)" d="M681 728Q681 713 696 703L1005 526Q1019 518 1022 509Q1030 496 1045 508L1064 521Q1077 535 1077 548V803Q1077 825 1055 838L765 1003Q746 1014 746 990V851Q746 837 735 829L697 806Q681 797 681 781Z"/>
  <path fill="url(#orange-top)" d="M696 703L1005 526Q1019 518 1022 509Q1030 496 1045 508L1064 521Q1090 546 1065 565L764 724Q744 736 724 725L687 706Q688 708 696 703Z"/>
</svg>
