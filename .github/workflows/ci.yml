name: ci
on:
  # Once per commit: pushes to main and pull requests. Tags don't re-run CI; release.yml waits for
  # this workflow to have passed on the tagged commit instead.
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Skills identical across clients, manifest versions match package.json
        run: npm run validate
      - name: Install CI tools (pinned by .github/ci-tools/package-lock.json, updated by Dependabot)
        run: |
          npm ci --prefix .github/ci-tools --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Claude plugin + marketplace manifests
        run: |
          claude plugin validate --strict claude
          claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Codex manifests (Agent Plugins 1.0.0 schemas)
        run: node scripts/validate-codex-schemas.mjs
      - name: skills.sh discovers exactly one skill
        # CI=true makes the skills CLI colorize its output; strip ANSI codes before matching.
        env:
          NO_COLOR: "1"
        run: skills add . --list | sed 's/\x1b\[[0-9;]*m//g' | grep -q "Found 1 skill"
      - name: Bundled plugins build, validate, and their MCP servers start (Claude, Cursor, Codex)
        run: |
          npm ci
          npm run package:plugins
          for c in claude cursor codex; do
            OSMATRIX_TEST_PLUGIN_ROOT="$PWD/artifacts/$c/osmatrix" node --test test/mcp.test.ts
          done
          claude plugin validate --strict artifacts/.claude-plugin/marketplace.json

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        shell: bash
        env:
          OSMATRIX_HOME: ${{ runner.temp }}/osmatrix
        run: |
          node dist/cli.js --version
          node dist/cli.js --json config > /dev/null
          node dist/cli.js --json ci plan --repo fixtures/matrix-demo
          node dist/cli.js install-agents --dry-run
      - name: Package installs
        shell: bash
        run: |
          npm pack
          npm install -g ./osmatrix-*.tgz
          osmatrix --version

  integration:
    # Linux runners have Docker: exercise the container guest, forwarding and host act legs end to end.
    runs-on: ubuntu-latest
    env:
      OSMATRIX_HOME: ${{ github.workspace }}/.osmatrix-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci && npm run build
      - run: node dist/cli.js up ubuntu --wait 600
      - run: node dist/cli.js exec ubuntu -- uname -a
      - name: forward a guest port to the host
        run: |
          node dist/cli.js push ubuntu fixtures/matrix-demo
          # --background keeps the server alive after the ssh session; a bare `cmd &` holds the session open.
          node dist/cli.js exec ubuntu --background --cwd work/matrix-demo -- node scripts/server.js 8080
          sleep 2
          node dist/cli.js --json forward ubuntu 8080 | tee fwd.json
          curl -sf "$(node -p 'require("./fwd.json").url')/x"
      - name: Linux legs of the demo workflow via act
        run: |
          node dist/cli.js ci run --repo fixtures/matrix-demo --only linux --wait || {
            node dist/cli.js ci status --repo fixtures/matrix-demo --full
            exit 1
          }
      - name: Clean up the guest (matters when this job runs locally under act)
        if: always()
        run: node dist/cli.js destroy ubuntu --yes

  # Single required check for rulesets and Dependabot auto-merge: passes only when every job above
  # succeeded, so new jobs are covered without editing branch protection.
  ci-gate:
    name: CI Gate
    needs: [plugins, unit, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required CI job did not succeed ($r)"; exit 1; }; done
